name: Map Art Sweep

# Capture card art for pool templates that don't have it yet.
# Art comes from a clean game board (a finished game, or one still in its
# picks stage). Runs weekly, when templates.json is pushed by hand, or by
# hand with a template_id + game_id for templates with no picks stage.
# (The engine's own data pushes don't start workflows, so history.json
# commits never trigger this.)

on:
  push:
    paths:
      - data/templates.json # new template added to the pool
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      template_id:
        description: "manual: pool template to (re)capture"
        required: false
      game_id:
        description: "manual: finished game on the same map/settings to capture it from"
        required: false
      pw_fp:
        description: "debug: sha256 of expected WZ_PASSWORD"
        required: false
      email_fp:
        description: "debug: sha256 of expected WZ_EMAIL"
        required: false

concurrency:
  group: map-art
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install capture dependencies
        run: npm install --no-save puppeteer sharp

      - name: Capture missing map art
        env:
          # the capture signs into war.app with a member login (email+password
          # pair) — distinct from the engine's bot-account API credentials
          WZ_EMAIL: ${{ secrets.WZ_LOGIN_EMAIL }}
          WZ_PASSWORD: ${{ secrets.WZ_PASSWORD }}
          ART_TEMPLATE: ${{ inputs.template_id }}
          ART_GAME: ${{ inputs.game_id }}
          PW_FP: ${{ inputs.pw_fp }}
          EMAIL_FP: ${{ inputs.email_fp }}
        run: node scripts/capture_map_art.js

      - name: Commit new art
        run: |
          git config user.name "Norman (Bot)"
          git config user.email "norman-bot@users.noreply.github.com"
          git add assets/maps
          if git diff --cached --quiet; then
            echo "no new art"
          else
            git commit -m "Map art: capture new pool templates"
            git pull --rebase origin main
            git push origin main
          fi
